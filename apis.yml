aid: auron-therapeutics
name: Auron Therapeutics
description: Auron Therapeutics is a clinical-stage biotechnology company headquartered
  in Newton, Massachusetts, developing therapies that target cell-state plasticity
  to address the underlying causes of disease across oncology and inflammatory disease
  indications. The company built the AURIGIN platform, which integrates multi-omic
  profiling and computational biology to map how cells change states and identify
  those states that can be therapeutically targeted. Auron was founded by Dr. Katharine
  Yen with co-founders Dr. Ross Levine, Dr. Eytan Stein, and Dr. Matthew Vander Heiden,
  a team drawing on experience from Agios Pharmaceuticals and its FDA-approved IDH
  inhibitor programs. It is backed by investors including Apollo, Arkin Bio, Casdin
  Capital, and DCVC Bio. As a therapeutics company Auron publishes no public developer
  API, documentation, or developer portal; this profile captures its corporate and
  legal web presence only.
